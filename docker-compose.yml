# Every service caps its log files. Uncapped json-file logs are unbounded and
# had grown to ~690MB, which is most of what filled the 8.6GB disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "1"

services:
  app:
    # Built and pushed by CI, never built here. The droplet has 960MB RAM and
    # under 2GB free disk, which is not enough for `yarn install` -- deploys
    # died on ENOSPC. It only has to pull a ~200MB image now.
    image: ${APP_IMAGE:-ghcr.io/mattmillsxyz/robotrack:latest}
    pull_policy: always
    ports:
      - "127.0.0.1:3000:3000"  # Only bind to localhost
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required, set it in .env}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    # `restart: unless-stopped` only reacts to a process that exits. It does
    # nothing for a process that is still alive but no longer serving, which is
    # how this app sat wedged at 100% CPU for seven months. The healthcheck is
    # what makes that state visible, and autoheal below is what acts on it.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "8", "http://127.0.0.1:3000/api/robots"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  redis:
    image: redis:7-alpine
    # Remove port mapping to prevent external access
    # ports:
    #   - "6379:6379"
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required, set it in .env}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "5", "http://127.0.0.1/healthz"]
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 20s

  # Restarts any container this compose file marks unhealthy. Without it the
  # healthchecks above would only ever be a status label nobody reads.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  redis_data:
