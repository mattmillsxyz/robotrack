name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is built here rather than on the droplet. The droplet has
      # 960MB RAM and under 2GB free disk, so `yarn install` there fails on
      # ENOSPC no matter how the build is arranged.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Re-pull the node base image on every build. A floating tag like
          # node:24-alpine only picks up security patches if the build doesn't
          # reuse a stale cached base layer.
          pull: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,APP_IMAGE
          script: |
            set -euo pipefail

            cd /opt/robotrack

            # Hard reset rather than `git pull`. The droplet is a deployment
            # target, not a working copy: a file edited on the server during an
            # incident makes `pull` abort and blocks every later deploy until
            # someone SSHes in. Untracked files like .env are left alone.
            git fetch origin main
            git reset --hard origin/main

            echo "Deploying commit:"
            git log --oneline -1

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pinned to this commit's digest so a deploy is reproducible and a
            # rollback is just re-running an older workflow.
            export APP_IMAGE
            docker compose pull
            docker compose up -d --remove-orphans

            # Reclaim space only once the new containers are running.
            docker image prune -f

            # Fail the deploy loudly rather than reporting success on a site
            # that is not serving.
            echo "Waiting for app to become healthy..."
            for i in $(seq 1 30); do
              if curl -fsS -m 5 -o /dev/null http://127.0.0.1:3000/api/robots; then
                echo "App is healthy."
                docker ps
                echo "Deployment completed successfully!"
                exit 0
              fi
              sleep 5
            done

            echo "Deploy failed: app did not become healthy in 150s"
            docker compose ps
            docker compose logs --tail 40 app
            exit 1
