events {
    worker_connections 1024;
}

http {
    upstream app {
        server app:3000;
    }

    # HTTP server - ACME challenges, then redirect to HTTPS
    server {
        listen 80;
        server_name robotrack.mattmills.xyz;

        # Let's Encrypt renewal must be reachable over plain HTTP,
        # so it has to be matched before the HTTPS redirect below.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Container healthcheck target. Must be on the plain-HTTP server so the
        # check never depends on the certificate being valid.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name robotrack.mattmills.xyz;

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/robotrack.mattmills.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/robotrack.mattmills.xyz/privkey.pem;

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
